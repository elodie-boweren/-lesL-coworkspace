name: Gitleaks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Image pinned by digest (supply-chain hardening).
      # Same content is also on Docker Hub as zricethezav/gitleaks.
      - name: Run Gitleaks
        env:
          IMG: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          docker pull "$IMG"
          docker run --rm -v "$PWD:/path:ro" "$IMG" detect --source=/path --verbose --redact
